name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - v[0-9]+.*

jobs:
  create-release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
          token: ${{ secrets.RELEASE_TOKEN }}

  upload-assets:
    needs: create-release
    strategy:
      matrix:
        include:
          - filename: delete_empty_folders_linux_arm_64
            target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
          - filename: delete_empty_folders_linux_intel_64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - filename: delete_empty_folders_macos_arm_64
            target: aarch64-apple-darwin
            os: macos-latest
          - filename: delete_empty_folders_macos_intel_64
            target: x86_64-apple-darwin
            os: macos-latest
          - filename: delete_empty_folders_windows_intel_64
            target: x86_64-pc-windows-msvc
            os: windows-latest
          - filename: delete_empty_folders_windows_arm_64
            target: aarch64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - run: rustup update stable
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          archive: ${{ matrix.filename }}
          bin: delete_empty_folders
          target: ${{ matrix.target }}
          token: ${{ secrets.RELEASE_TOKEN }}
