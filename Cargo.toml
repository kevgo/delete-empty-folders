[package]
name = "delete-empty-folders"
version = "0.0.1"
edition = "2024"

[dependencies]
ignore = "0.4.25"

[dev-dependencies]
cucumber = "0.23.0"
itertools = "0.14.0"
pretty = { package = "pretty_assertions", version = "1.4.1" }
rand = "0.9.1"
tokio = { version = "1.52.2", features = ["fs", "io-util", "macros", "process", "rt"] }

[[test]]
name = "cucumber" # this should be the same as the filename of your test target
harness = false # allows Cucumber to print output instead of libtest
test = false # don't run this as part of "cargo test"

[profile.release]
codegen-units = 1
debug = 0
lto = true
opt-level = "z"
panic = "abort"
strip = "symbols"

[lints.clippy]
pedantic = "warn"

[lints.rust]
unsafe_code = "forbid"
